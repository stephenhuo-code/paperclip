name: Deploy to Aliyun

# Builds the Paperclip image and the deploy assets for this commit, mirrors the
# base images into Alibaba Cloud ACR, and asks Cloud Assistant to deploy on the
# ECS instance. See deploy/aliyun/README.md.
on:
  push:
    branches: [deploy/production]
  workflow_dispatch:
    inputs:
      env:
        description: Environment file under deploy/aliyun/environments
        required: true
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-aliyun-${{ inputs.env || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.env || 'production' }}
    env:
      DEPLOY_ENV: ${{ inputs.env || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy assets
        run: |
          node --test deploy/aliyun/tests/*.test.mjs

      - name: Load environment settings
        run: |
          file="deploy/aliyun/environments/${DEPLOY_ENV}.env"
          test -f "$file"
          grep -E '^(ALIYUN_REGION|ECS_INSTANCE_ID|ACR_REGISTRY|ACR_NAMESPACE|KEYCLOAK_VERSION|POSTGRES_VERSION|CADDY_VERSION)=' "$file" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Paperclip image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/paperclip:${{ github.sha }}
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push deploy assets
        uses: docker/build-push-action@v6
        with:
          context: deploy/aliyun
          file: deploy/aliyun/Dockerfile.assets
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/paperclip-deploy:${{ github.sha }}

      - name: Mirror base images into ACR
        run: |
          mirror() {
            local source="$1" target="${ACR_REGISTRY}/${ACR_NAMESPACE}/$2"
            if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
              echo "present: $target"
            else
              docker buildx imagetools create --tag "$target" "$source"
            fi
          }
          mirror "quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}" "keycloak:${KEYCLOAK_VERSION}"
          mirror "docker.io/library/postgres:${POSTGRES_VERSION}" "postgres:${POSTGRES_VERSION}"
          mirror "docker.io/library/caddy:${CADDY_VERSION}" "caddy:${CADDY_VERSION}"

      - name: Install aliyun CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | tar xz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Deploy through Cloud Assistant
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
        run: deploy/aliyun/scripts/ci-run-command.sh "$DEPLOY_ENV" "$COMMIT_SHA"
